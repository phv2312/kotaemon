collection_name: &collection_name "default"
collection_idx: &collection_idx "1"
collection_private: &collection_private false
user_id: &user_id "1"

embedding_model: &embedding_model "azure"
llm_model: &llm_model "azure"

indexer_settings: &indexer_settings
  embedding: *embedding_model
  llm: *llm_model

retriever_settings: &retriever_settings
  embedding: *embedding_model
  llm: *llm_model

components:
  - name: source
    type: "Source"
    container: "FileSchema"
    params:
      collection_idx: *collection_idx
      private: *collection_private

  - name: index
    type: "Index"
    container: "FileSchema"
    params:
      collection_idx: *collection_idx

  - name: vector_store
    type: "chroma"
    container: "VectorStore"
    params:
      collection_name: *collection_name

  - name: document_store
    type: "lancedb"
    container: "DocumentStore"
    params:
      collection_name: *collection_name

  - name: indexer
    type: "nano_graphrag"
    container: "Indexer"
    params:
      source: source
      index: index
      vectorstore: vector_store
      documentstore: document_store
      index_settings: *indexer_settings
      collection_idx: *collection_idx
      user_id: *user_id
      private: *collection_private

  - name: retriever
    type: "nano_graphrag"
    container: "Retriever"
    params:
      index: index
      vectorstore: vector_store
      index_settings: *indexer_settings
